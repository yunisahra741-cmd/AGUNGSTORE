name: Build AGUNGSTORE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          rm -rf source
          mkdir source
          unzip -q AGUNGSTORE-Android-Source.zip -d source

          echo "=== Isi source ==="
          find source -maxdepth 4 -type f | head -100

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)")

          echo "PROJECT_DIR=$PROJECT_DIR"

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: Android project tidak ditemukan!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show project files
        run: |
          cd "$PROJECT_DIR"
          echo "=== PROJECT DIRECTORY ==="
          pwd
          echo "=== FILES ==="
          ls -la
          echo "=== APP DIRECTORY ==="
          ls -la app || true

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== MENCARI APK ==="
          find source -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AGUNGSTORE-APK
          path: source/**/*.apk
          if-no-files-found: error
