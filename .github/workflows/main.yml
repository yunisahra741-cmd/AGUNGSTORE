name: Build AGUNGSTORE APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # CHECK SOURCE ZIP
      # ==========================================
      - name: Check source file
        run: |
          echo "================================"
          echo "CEK FILE REPOSITORY"
          echo "================================"

          ls -lah

          if [ ! -f "AGUNGSTORE-Android.zip" ]; then
            echo "ERROR!"
            echo "File AGUNGSTORE-Android.zip tidak ditemukan!"
            exit 1
          fi

          echo "AGUNGSTORE-Android.zip ditemukan!"


      # ==========================================
      # EXTRACT ANDROID SOURCE
      # ==========================================
      - name: Extract Android source
        run: |
          echo "================================"
          echo "EXTRACT ANDROID SOURCE"
          echo "================================"

          rm -rf source
          mkdir -p source

          unzip -q "AGUNGSTORE-Android.zip" -d source

          echo "=== FILE SOURCE ==="

          find source -maxdepth 5 -type f | head -200


      # ==========================================
      # FIND ANDROID PROJECT
      # ==========================================
      - name: Find Android project
        run: |
          echo "================================"
          echo "MENCARI PROJECT ANDROID"
          echo "================================"

          SETTINGS_FILE=$(find source -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          echo "SETTINGS_FILE=$SETTINGS_FILE"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle tidak ditemukan!"

            echo "=== SEMUA FILE ==="
            find source -type f | head -500

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # SHOW PROJECT INFORMATION
      # ==========================================
      - name: Show Android project
        run: |
          cd "$PROJECT_DIR"

          echo "================================"
          echo "PROJECT DIRECTORY"
          echo "================================"

          pwd

          echo ""
          echo "=== ISI PROJECT ==="

          ls -lah

          echo ""
          echo "=== STRUKTUR PROJECT ==="

          find . -maxdepth 3 -type f | head -200


      # ==========================================
      # SETUP JAVA 17
      # ==========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # SETUP GRADLE
      # ==========================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4


      # ==========================================
      # ENABLE ANDROIDX
      # ==========================================
      - name: Enable AndroidX
        run: |
          cd "$PROJECT_DIR"

          echo "================================"
          echo "ENABLE ANDROIDX"
          echo "================================"

          touch gradle.properties

          sed -i '/^android.useAndroidX=/d' gradle.properties
          sed -i '/^android.enableJetifier=/d' gradle.properties

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          echo ""
          echo "=== gradle.properties ==="

          cat gradle.properties


      # ==========================================
      # FIX KOTLIN DUPLICATE CLASSES
      # ==========================================
      - name: Fix Kotlin duplicate classes
        run: |
          cd "$PROJECT_DIR"

          echo "================================"
          echo "FIX KOTLIN DEPENDENCY"
          echo "================================"

          cat > kotlin-fix.gradle <<'EOF'
          allprojects {

              configurations.configureEach {

                  resolutionStrategy {

                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"

                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"

                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"

                  }

              }

          }
          EOF

          echo ""
          echo "=== kotlin-fix.gradle ==="

          cat kotlin-fix.gradle


      # ==========================================
      # APPLY KOTLIN FIX
      # ==========================================
      - name: Apply Kotlin fix
        run: |
          cd "$PROJECT_DIR"

          echo "================================"
          echo "APPLY KOTLIN FIX"
          echo "================================"

          if [ -f "build.gradle" ]; then

            if ! grep -q "kotlin-fix.gradle" build.gradle; then

              echo "" >> build.gradle
              echo "apply from: 'kotlin-fix.gradle'" >> build.gradle

            fi

          else

            echo "WARNING: build.gradle tidak ditemukan"

          fi

          echo ""
          echo "=== ROOT BUILD.GRADLE ==="

          cat build.gradle || true


      # ==========================================
      # PREPARE GRADLE
      # ==========================================
      - name: Prepare Gradle
        run: |
          cd "$PROJECT_DIR"

          echo "================================"
          echo "PREPARE GRADLE"
          echo "================================"

          if [ -f "./gradlew" ]; then

            echo "Gradle Wrapper ditemukan"

            chmod +x ./gradlew

            echo "GRADLE_COMMAND=./gradlew" >> "$GITHUB_ENV"

            ./gradlew --version

          else

            echo "Gradle Wrapper tidak ditemukan"
            echo "Menggunakan Gradle sistem"

            echo "GRADLE_COMMAND=gradle" >> "$GITHUB_ENV"

            gradle --version

          fi


      # ==========================================
      # CHECK DEPENDENCIES
      # ==========================================
      - name: Check dependencies
        run: |
          cd "$PROJECT_DIR"

          echo "================================"
          echo "CEK DEPENDENCY"
          echo "================================"

          $GRADLE_COMMAND :app:dependencies \
            --configuration debugRuntimeClasspath \
            --no-daemon || true


      # ==========================================
      # CLEAN PROJECT
      # ==========================================
      - name: Clean project
        run: |
          cd "$PROJECT_DIR"

          echo "================================"
          echo "CLEAN PROJECT"
          echo "================================"

          $GRADLE_COMMAND clean \
            --no-daemon


      # ==========================================
      # BUILD DEBUG APK
      # ==========================================
      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          echo "================================"
          echo "MULAI BUILD AGUNGSTORE APK"
          echo "================================"

          $GRADLE_COMMAND assembleDebug \
            --stacktrace \
            --info \
            --no-daemon


      # ==========================================
      # FIND GENERATED APK
      # ==========================================
      - name: Find APK
        run: |
          echo "================================"
          echo "MENCARI APK"
          echo "================================"

          echo "=== SEMUA APK ==="

          find source -type f -name "*.apk" -print

          echo ""
          echo "=== MENCARI DEBUG APK ==="

          APK_FILE=$(find source \
            -type f \
            -name "*debug*.apk" \
            | head -1)

          # Jika tidak ditemukan, cari APK biasa
          if [ -z "$APK_FILE" ]; then

            APK_FILE=$(find source \
              -type f \
              -name "*.apk" \
              | head -1)

          fi

          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK tidak ditemukan!"

            exit 1

          fi

          echo ""
          echo "================================"
          echo "APK BERHASIL DITEMUKAN!"
          echo "================================"

          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # SHOW APK INFORMATION
      # ==========================================
      - name: Show APK information
        run: |
          echo "================================"
          echo "INFORMASI APK"
          echo "================================"

          echo "Lokasi APK:"
          echo "$APK_FILE"

          echo ""

          ls -lh "$APK_FILE"


      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload AGUNGSTORE APK
        uses: actions/upload-artifact@v4
        with:
          name: AGUNGSTORE-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 7
