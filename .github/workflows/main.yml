name: Build AGUNGSTORE APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================
      # CHECKOUT REPOSITORY
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================
      # CHECK SOURCE ZIP
      # =========================
      - name: Check source file
        run: |
          echo "=== FILE DI REPOSITORY ==="
          ls -lah

          if [ ! -f "AGUNGSTORE-Android.zip" ]; then
            echo "ERROR: File AGUNGSTORE-Android.zip tidak ditemukan!"
            exit 1
          fi

          echo "SOURCE ZIP DITEMUKAN!"


      # =========================
      # EXTRACT ANDROID SOURCE
      # =========================
      - name: Extract Android source
        run: |
          rm -rf source
          mkdir -p source

          unzip -q AGUNGSTORE-Android.zip -d source

          echo "=== STRUKTUR SOURCE ==="
          find source -maxdepth 5 -type f | head -200


      # =========================
      # FIND ANDROID PROJECT
      # =========================
      - name: Find Android project
        run: |
          echo "=== MENCARI ANDROID PROJECT ==="

          SETTINGS_FILE=$(find source -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          echo "SETTINGS_FILE=$SETTINGS_FILE"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle tidak ditemukan!"
            echo "=== ISI SOURCE ==="
            find source -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================
      # SHOW PROJECT INFORMATION
      # =========================
      - name: Show Android project
        run: |
          echo "=== PROJECT DIRECTORY ==="
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== FILE PROJECT ==="
          ls -lah

          echo "=== FILE ANDROID ==="
          find . -maxdepth 3 -type f | head -200


      # =========================
      # SETUP JAVA 17
      # =========================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================
      # SETUP GRADLE
      # =========================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4


      # =========================
      # ENABLE ANDROIDX
      # =========================
      - name: Enable AndroidX
        run: |
          cd "$PROJECT_DIR"

          touch gradle.properties

          sed -i '/^android.useAndroidX=/d' gradle.properties
          sed -i '/^android.enableJetifier=/d' gradle.properties

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          echo "=== gradle.properties ==="
          cat gradle.properties


      # =========================
      # PREPARE GRADLE
      # =========================
      - name: Prepare Gradle
        run: |
          cd "$PROJECT_DIR"

          echo "=== CEK GRADLE ==="

          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper ditemukan"

            chmod +x ./gradlew

            ./gradlew --version

            echo "GRADLE_COMMAND=./gradlew" >> "$GITHUB_ENV"

          else
            echo "Gradle Wrapper tidak ditemukan"
            echo "Menggunakan Gradle sistem"

            gradle --version

            echo "GRADLE_COMMAND=gradle" >> "$GITHUB_ENV"
          fi


      # =========================
      # CLEAN PROJECT
      # =========================
      - name: Clean project
        run: |
          cd "$PROJECT_DIR"

          echo "=== CLEAN PROJECT ==="

          $GRADLE_COMMAND clean \
            --no-daemon


      # =========================
      # BUILD DEBUG APK
      # =========================
      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          echo "=== MULAI BUILD APK ==="

          $GRADLE_COMMAND assembleDebug \
            --stacktrace \
            --no-daemon


      # =========================
      # SHOW GENERATED APK
      # =========================
      - name: Show generated APK
        run: |
          echo "=== MENCARI FILE APK ==="

          find source -type f -name "*.apk" -print

          APK_FILE=$(find source -type f -name "*.apk" | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK tidak ditemukan!"
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"


      # =========================
      # UPLOAD APK ARTIFACT
      # =========================
      - name: Upload AGUNGSTORE APK
        uses: actions/upload-artifact@v4
        with:
          name: AGUNGSTORE-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 7
